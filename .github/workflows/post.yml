name: gundem360 haber botu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gundem360-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Haberleri cek ve gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Gonderilen haberleri kaydet
        run: |
          git config user.name "gundem360-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "seen.json guncellendi"
            git push
          fi